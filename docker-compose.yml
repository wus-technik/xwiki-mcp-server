version: '3.8'

services:
  mcp-xwiki:
    build: .
    container_name: mcp-xwiki
    ports:
      - "3000:3000"
    extra_hosts:
      # Required: MCP container needs to resolve Authentik for token exchange
      - sso.wus-technik.com:10.1.15.1
    environment:
      - PORT=3000
      # Use internal Docker hostname — join the xwiki stack network below
      - XWIKI_URL=${XWIKI_URL:-http://xwiki-postgres-tomcat-web:8080}
      - XWIKI_PUBLIC_URL=${XWIKI_PUBLIC_URL:-}
      - XWIKI_WIKI=${XWIKI_WIKI:-xwiki}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      # Must include /mcp/ prefix — this URL goes through HAProxy
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI}
      - MCP_BASE_URL=${MCP_BASE_URL}
      # Signs the access tokens (JWT); at least 32 bytes
      - SESSION_SECRET=${SESSION_SECRET}
      # Persistent store (clients, consents, sessions, refresh families, cleanups) on the volume.
      # Sessions survive container recreates. XWiki tokens and Authentik refresh tokens in it
      # are encrypted with TOKEN_ENC_KEY.
      - STORE_FILE=/data/store.json
      # 32 random bytes, base64. Without it the server does not start, and the store file is
      # unusable without the same key: keep it in the password manager.
      - TOKEN_ENC_KEY=${TOKEN_ENC_KEY}
      # Authentik groups allowed to use the MCP server (comma-separated)
      - ALLOWED_GROUPS=${ALLOWED_GROUPS:-AdminsIT,xwiki_redaktion}
      # Slug of the Authentik application (issuer <AUTHENTIK_ISSUER>/application/o/<slug>/)
      - AUTHENTIK_APP_SLUG=${AUTHENTIK_APP_SLUG:-xwiki-mcp}
      # Additional allowed redirect URIs / Origins for MCP clients (comma-separated, exact)
      - EXTRA_REDIRECT_URIS=${EXTRA_REDIRECT_URIS:-}
      - EXTRA_ORIGINS=${EXTRA_ORIGINS:-}
      - NODE_ENV=${NODE_ENV:-production}
      - AUTH_DEBUG=${AUTH_DEBUG:-0}
      # Dev only — do NOT set to 0 in production
      # - NODE_TLS_REJECT_UNAUTHORIZED=0
    volumes:
      - ./data:/data
    networks:
      - stack
    restart: unless-stopped

networks:
  stack:
    # Join the existing XWiki stack network so the container can reach
    # xwiki-postgres-tomcat-web:8080 directly without going through HAProxy.
    # The network name may vary — check with: docker network ls | grep xwiki
    external: true
    name: xwiki_stack
